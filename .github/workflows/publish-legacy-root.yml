name: Publish compiled site to legacy Pages root

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: legacy-pages-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build-and-commit:
    if: github.actor != 'github-actions[bot]' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest

    steps:
      - name: Checkout pull request branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build and verify production site
        run: npm run check

      - name: Copy compiled site into the Pages source root
        run: |
          find assets -maxdepth 1 -type f \( -name '*.js' -o -name '*.css' -o -name '*.map' \) -delete 2>/dev/null || true
          cp -a dist/. ./
          touch .nojekyll

      - name: Commit compiled output to the pull request branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A

          if git diff --cached --quiet; then
            echo "Compiled output is already current."
            exit 0
          fi

          git commit -m "chore: publish compiled website [skip ci]"
          git push origin "HEAD:${{ github.head_ref }}"
